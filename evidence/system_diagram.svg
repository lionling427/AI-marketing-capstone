<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Inter, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4A535C"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B54708"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1B2128">TraceReady – system diagram</text>
  <text x="40" y="80" font-size="15" fill="#5B636B">Input → processing → output → action, with human review before anything becomes a record. Dashed = simulated in the prototype.</text>

  <!-- column labels -->
  <g font-size="13" font-weight="700" fill="#5B636B" letter-spacing="1">
    <text x="40" y="118">1  INPUT</text><text x="330" y="118">2  PROCESSING (AI + RULES)</text><text x="700" y="118">3  HUMAN REVIEW</text><text x="960" y="118">4  RECORDS</text><text x="1160" y="118">5  OUTPUT / ACTION</text>
  </g>

  <!-- inputs -->
  <g font-size="14" fill="#1B2128">
    <rect x="40" y="132" width="250" height="88" rx="12" fill="#F4F5F2" stroke="#9AA1A8"/>
    <text x="56" y="158" font-weight="700">Supplier documents (upload)</text><text x="56" y="180">Invoice · packing slip · BOL</text><text x="56" y="200">Pallet label photo</text>
    <rect x="40" y="236" width="250" height="150" rx="12" fill="#F4F5F2" stroke="#9AA1A8" stroke-dasharray="7 5"/>
    <text x="56" y="262" font-weight="700">Connected inbox (.eml)</text><text x="56" y="284">Supplier replies + label photo</text><text x="56" y="304">Stores: signed delivery receipts</text><text x="56" y="324">FDA records request</text><text x="56" y="344">Recall notice · store replies</text><text x="56" y="366" fill="#B54708" font-size="12">Simulated: folder + story clock</text>
    <rect x="40" y="402" width="250" height="70" rx="12" fill="#F4F5F2" stroke="#9AA1A8"/>
    <text x="56" y="428" font-weight="700">Master data</text><text x="56" y="450">Partners · products · FDA columns</text>
  </g>

  <!-- processing -->
  <g font-size="14" fill="#1B2128">
    <rect x="330" y="132" width="330" height="118" rx="12" fill="#EFF4FF" stroke="#175CD3" stroke-dasharray="7 5"/>
    <text x="346" y="158" font-weight="700" fill="#175CD3">AI extraction</text>
    <text x="346" y="180">Reads each document / email into fields:</text><text x="346" y="200">supplier, PO, lot (TLC), GTIN, qty, dates,</text><text x="346" y="220">customer, destroyed / sold counts</text>
    <text x="346" y="240" fill="#B54708" font-size="12">Simulated: returns checked answers (data/expected)</text>
    <rect x="330" y="266" width="330" height="206" rx="12" fill="#ECFDF3" stroke="#1F6F5C"/>
    <text x="346" y="292" font-weight="700" fill="#1F6F5C">Rules (backend/checks.py + page)</text>
    <text x="346" y="316">• Lot unreadable / missing</text><text x="346" y="338">• Quantities disagree between documents</text><text x="346" y="360">• Supplier lot: duplicate or wrong pack date</text><text x="346" y="382">• Shipment lot has no receiving record</text><text x="346" y="404">• Shipped more than received</text><text x="346" y="426">• Recall form: destroyed + sold ≠ received</text><text x="346" y="448">• Required FDA Key Data Elements present</text>
  </g>

  <!-- human review -->
  <g font-size="14" fill="#1B2128">
    <rect x="700" y="132" width="220" height="340" rx="12" fill="#FFFAEB" stroke="#B54708"/>
    <text x="716" y="158" font-weight="700" fill="#B54708">Person decides</text>
    <text x="716" y="184">Choose quantity + reason</text><text x="716" y="208">Send / follow up supplier</text><text x="716" y="232">Verify lot from photo</text><text x="716" y="256">Check receipts vs lots</text><text x="716" y="280">Block lot, notify, call</text><text x="716" y="304">Confirm each store's</text><text x="716" y="324">evidence</text>
    <text x="716" y="356" font-weight="700">E-signature required:</text><text x="716" y="378">receiving record</text><text x="716" y="400">shipment link</text><text x="716" y="422">incident close</text>
    <text x="716" y="452" font-size="12" fill="#5B636B">Signing blocked while a rule fails</text>
  </g>

  <!-- records -->
  <g font-size="14" fill="#1B2128">
    <rect x="960" y="132" width="170" height="340" rx="12" fill="#F4F5F2" stroke="#1B2128"/>
    <text x="976" y="158" font-weight="700">SQLite</text>
    <text x="976" y="184">cases</text><text x="976" y="206">receiving_events</text><text x="976" y="228">shipping_events</text><text x="976" y="250">lots</text><text x="976" y="272">signatures</text><text x="976" y="294">audit_log</text><text x="976" y="316">recall_contacts</text><text x="976" y="338">emails · documents</text><text x="976" y="360">extractions</text>
    <text x="976" y="396" font-size="12" fill="#5B636B">FDA template columns,</text><text x="976" y="414" font-size="12" fill="#5B636B">36 per event</text>
  </g>

  <!-- outputs -->
  <g font-size="14" fill="#1B2128">
    <rect x="1160" y="132" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#1B2128"/><text x="1176" y="158" font-weight="700">FDA 24-h spreadsheet</text><text x="1176" y="180">Receiving + shipping tabs</text><text x="1176" y="200">CSV export</text>
    <rect x="1160" y="236" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#1B2128"/><text x="1176" y="262" font-weight="700">Recall</text><text x="1176" y="284">Who got the lot · notices</text><text x="1176" y="304">Report to supplier</text>
    <rect x="1160" y="340" width="200" height="132" rx="12" fill="#FFFFFF" stroke="#1B2128"/><text x="1176" y="366" font-weight="700">History &amp; trace</text><text x="1176" y="388">Search by date / lot</text><text x="1176" y="408">Came from → went to</text><text x="1176" y="428">Audit trail</text><text x="1176" y="448">Compliance gaps</text>
  </g>

  <!-- arrows -->
  <g stroke="#4A535C" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M290 176 L326 190"/><path d="M290 310 L326 210"/><path d="M290 436 L326 400"/>
    <path d="M495 250 L495 262"/>
    <path d="M660 300 L696 300"/>
    <path d="M920 300 L956 300"/>
    <path d="M1130 176 L1156 176"/><path d="M1130 280 L1156 280"/><path d="M1130 406 L1156 406"/>
  </g>
  <!-- feedback loop -->
  <g stroke="#B54708" stroke-width="2" fill="none" marker-end="url(#h)" stroke-dasharray="6 5">
    <path d="M810 472 L810 560 L165 560 L165 476"/>
  </g>
  <text x="300" y="584" font-size="14" fill="#B54708">Feedback: requests to supplier / stores create new inbox emails; corrections re-run the rules</text>

  <!-- legend / stack -->
  <rect x="40" y="620" width="1320" height="200" rx="12" fill="#F9FAFB" stroke="#E1E4DF"/>
  <text x="60" y="652" font-size="16" font-weight="700" fill="#1B2128">Architecture</text>
  <g font-size="14" fill="#1B2128">
    <text x="60" y="682">Browser: frontend/index.html + js/app.js (screens, story, 3 languages, signature pad) + js/api.js (load data, import mail, save state)</text>
    <text x="60" y="708">Server: backend/app.py (Python standard library HTTP server) · store.py · mailbox.py · checks.py · fda.py · schema.sql → SQLite</text>
    <text x="60" y="734">Data: data/seed (JSON) · data/documents (PDF, previews) · data/inbox (.eml with attachments) · data/expected (checked answers for extraction tests)</text>
    <text x="60" y="760">Dependencies: Python 3.8+ only. Optional: reportlab (redraw documents), playwright (tests).</text>
    <text x="60" y="790" fill="#B54708">Not yet implemented: real model call for extraction, real mailbox (IMAP/Gmail), user accounts, ERP integration, sending to FDA.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
